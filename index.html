<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>问津 · 桃花源解谜</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/animation.css">
</head>
<body>
  <div id="stage">
    <div id="film">
      <div id="filmGrove"></div>
      <img class="filmImg" id="f1" src="assets/film-1.jpg" alt="">
      <img class="filmImg" id="f2" src="assets/film-2.jpg" alt="">
      <img class="filmImg" id="f3" src="assets/film-3.jpg" alt="">
      <img class="filmImg" id="f4" src="assets/film-4.jpg" alt="">
      <img class="filmImg" id="f5" src="assets/film-5.jpg" alt="">
      <div id="filmBottle"></div>
      <div id="filmNarr"></div>
      <img id="filmBall" src="assets/film-ball.png" alt="">
      <img id="filmGlow" src="assets/film-glow.png" alt="">
      <img id="filmCrack" src="assets/film-crack.png" alt="">
      <canvas id="filmCanvas" width="1400" height="788"></canvas>
      <div id="filmGold"></div>
      <div id="filmFlash"></div>
      <div id="filmTap">点击任意处继续</div>
      <div id="filmStart"><span>点击开始</span></div>
      <div id="filmSkip" class="hide">跳过</div>
    </div>
    <div id="bg"></div>
    <div id="veil"></div>
    <div id="glow"></div>
    <div id="fog"></div>
    <div id="probe"></div>
    <div id="warm"></div>
    <div id="fade"></div>
    <div id="dark"></div>
    <div id="layer"></div>
    <div id="hud"><span id="petalHud" class="hide">花瓣 0/5</span></div>
    <div id="toolToggle">收起</div>
    <div id="tools">
      <div class="rod top"></div><div class="roll"></div>
      <div class="cells" id="cells"></div>
      <div id="sealbar"></div>
      <div class="rod bot"></div>
      <div class="hintbar" id="hintbar">点花瓣→拿起。点凹槽→嵌入。</div>
    </div>
    <div id="sound">♪ 开</div>
    <div id="textbox" class="hidden"><p id="text"></p><div id="cont">点击任意处继续</div></div>
    <div id="reviewBtn">结局回顾</div>
    <div id="fx"></div>
    <div id="drag"></div>
    <div id="build">v29 · 印章逐枚</div>
  </div>
  <script src="js/text.js"></script>
<script src="js/core.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/effect.js"></script>
<script src="js/seals.js"></script>
<script src="js/endings.js"></script>
  <script src="js/act1.js"></script>
  <script src="js/act2.js"></script>
  <script src="js/act3.js"></script>
  <script src="js/film.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
